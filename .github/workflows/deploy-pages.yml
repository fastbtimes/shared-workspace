name: Deploy ClaimTrail to GitHub Pages

on:
  push:
    branches:
      - claude/unclaimed-property-search-cu6o46
    paths:
      - "unclaimed-tracker/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (Actions build type) so no manual settings toggle is needed.
          enablement: true

      - name: Upload static site (the app folder only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: unclaimed-tracker

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

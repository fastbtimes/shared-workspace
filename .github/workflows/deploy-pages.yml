name: Deploy ClaimTrail to GitHub Pages

# Pages enabled in repo settings; re-trigger after enablement.
on:
  push:
    branches:
      - claude/unclaimed-property-search-cu6o46
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        # Pages must be enabled once in repo Settings (Source = GitHub Actions).
        # We do NOT auto-create here, because the Actions token isn't permitted to.

      - name: Upload static site (the app folder only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: unclaimed-tracker

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
